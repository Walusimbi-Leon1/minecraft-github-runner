name: minecraft-server

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "How long to run the server (seconds)"
        required: false
        default: "10800"  # 3 hours

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # 3h + buffer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Minecraft server
        run: ./setup.sh

      - name: Start server & hold for duration
        env:
          DURATION: ${{ github.event.inputs.duration || '10800' }}
        run: |
          set -euo pipefail
          echo "Starting server for ${DURATION}s...";
          ./start.sh &
          SERVER_PID=$!
          sleep "$DURATION"
          echo "Time elapsed — shutting down...";
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true