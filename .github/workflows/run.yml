name: minecraft-server

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "How long to run the server (seconds)"
        required: false
        default: "10800"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      MC_PORT: "25565"
      MC_BORE_PORT: "30176"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Minecraft server
        run: ./setup.sh

      - name: Start server & hold for duration
        env:
          GH_PAT: ${{secrets.GH_PAT}}
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          DURATION=$(jq -r '.inputs.duration // "10800"' "$GITHUB_EVENT_PATH" 2>/dev/null || echo 10800)
          ./start.sh
          BORE_PID=$(cat bore.pid 2>/dev/null || true)
          echo "Bore relay PID: ${BORE_PID}"
          # Wait up to ~5 min for the world to generate before first save
          for w in $(seq 1 30); do
            if [ -d server/world ]; then echo "World generated after ~$((w*10))s"; break; fi
            sleep 10
          done
          if [ ! -d server/world ]; then
            echo "⚠️  World not generated within 5 min — check server/server.log"
            tail -25 server/server.log 2>/dev/null || true
          fi
          DUR=${DURATION:-10800}
          SAVED=0
          echo "=== Auto-save loop every 15 min ==="
          for i in $(seq 1 11); do
            REMAIN=$(( DUR - SAVED - 900 ))
            if [ "$REMAIN" -le 0 ]; then break; fi
            sleep 900
            SAVED=$((SAVED + 900))
            echo "--- Auto-save #${i} at $(date) (t=${SAVED}s) ---"
            # tell the running server to flush to disk, then snapshot
            screen -S mc -X stuff 'save-all'$'\r' 2>/dev/null || true
            sleep 5
            bash save-world.sh || echo "Auto-save failed - continuing"
          done
          echo "=== Final world save before shutdown ==="
          screen -S mc -X stuff 'save-all'$'\r' 2>/dev/null || true
          sleep 6
          bash save-world.sh || echo "Final save failed (server may have exited)"
          echo "=== Shutting down ==="
          # graceful stop via the server console (it saves on stop)
          screen -S mc -X stuff 'stop'$'\r' 2>/dev/null || true
          sleep 8
          screen -S mc -X quit 2>/dev/null || true
          [ -n "$BORE_PID" ] && kill "$BORE_PID" 2>/dev/null || true
          sleep 3
          echo "Shutdown complete."